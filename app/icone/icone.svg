<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Ícone do app: as contas em mosaico (2×2 pokébolas) sobre o fundo escuro da janela. -->
  <defs>
    <g id="bola">
      <circle r="50" fill="#f4f4f6"/>
      <path d="M -50 0 A 50 50 0 0 1 50 0 Z" fill="#e3350d"/>
      <rect x="-50" y="-6" width="100" height="12" fill="#15161a"/>
      <circle r="17" fill="#15161a"/>
      <circle r="10" fill="#f4f4f6"/>
      <circle r="50" fill="none" stroke="#15161a" stroke-width="6"/>
    </g>
  </defs>
  <rect width="256" height="256" rx="48" fill="#24262d"/>
  <use href="#bola" x="72" y="72"/>
  <use href="#bola" x="184" y="72"/>
  <use href="#bola" x="72" y="184"/>
  <use href="#bola" x="184" y="184"/>
</svg>
